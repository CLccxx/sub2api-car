name: Carpool release

on:
  push:
    tags:
      - 'v*-car.*'

concurrency:
  group: car-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'CLccxx/sub2api-car'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify tag and pinned source commit
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-car\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Test upgrade, recovery and publication boundaries
        run: python -B -m unittest discover -s deploy/tests -p 'test_*car.py'
      - name: Test application updater integration
        working-directory: backend
        run: go test -tags=unit ./internal/service ./internal/handler/admin ./internal/config -run 'TestCompareCustomReleaseVersions|TestUpdateService|TestCarUpdate|TestUnixManagedUpdater|TestSystemHandler|TestSystemManaged|TestLoadManagedUpdate' -count=1
      - name: Check backend lint before publishing
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend
      - name: Test version panel state
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/composables/__tests__/useManagedUpdate.test.ts src/stores/__tests__/app.spec.ts
      - name: Build and verify full deployment bundle
        run: python -B deploy/package_car.py "${RELEASE_TAG#v}"
      - name: Upload verified build for recovery
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-deployment
          path: |
            output/*.tar.gz
            output/*.sha256
            output/*/deploy/install_car_web_update.py
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete full release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B .github/release-tools/publish_car.py "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"
