# Production bundle for one small server. The bundle contains a prebuilt binary;
# Dockerfile.goreleaser only installs runtime libraries and packages that binary.
name: sub2api-car

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sub2api:
    image: sub2api-car:${SUB2API_CAR_VERSION:?Run init-car.sh first}
    build:
      context: ..
      dockerfile: Dockerfile.goreleaser
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./car-data/app:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      RUN_MODE: standard
      SERVER_TRUSTED_PROXIES: 172.30.27.10
      SECURITY_TRUST_FORWARDED_IP_FOR_API_KEY_ACL: "false"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Run init-car.sh first}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: "20"
      DATABASE_MAX_IDLE_CONNS: "5"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run init-car.sh first}
      REDIS_POOL_SIZE: "32"
      REDIS_MIN_IDLE_CONNS: "2"
      JWT_SECRET: ${JWT_SECRET:?Run init-car.sh first}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Run init-car.sh first}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Run init-car.sh first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run init-car.sh first}
      GOMEMLIMIT: 550MiB
      GOMAXPROCS: "2"
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    logging: *logging
    networks: [car]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 384m
    shm_size: 128m
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init-car.sh first}
      POSTGRES_DB: sub2api
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
    volumes:
      - ./car-data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api && psql -U sub2api -d sub2api -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging
    networks: [car]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 256m
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?Run init-car.sh first}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run init-car.sh first}
    volumes:
      - ./car-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging
    networks: [car]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "80:80"
      - "443:443"
    environment:
      SUB2API_DOMAIN: ${SUB2API_DOMAIN:?Run init-car.sh first}
      GOMEMLIMIT: 64MiB
    volumes:
      - ./Caddyfile.car:/etc/caddy/Caddyfile:ro
      - ./car-data/caddy-data:/data
      - ./car-data/caddy-config:/config
    depends_on:
      sub2api:
        condition: service_healthy
    logging: *logging
    networks:
      car:
        ipv4_address: 172.30.27.10

networks:
  car:
    ipam:
      config:
        - subnet: 172.30.27.0/24
